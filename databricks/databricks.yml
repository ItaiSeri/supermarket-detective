bundle:
  name: supermarket-detective

workspace:
  profile: supermarket

targets:
  dev:
    default: true

resources:
  jobs:
    bronze_load:
      name: bronze_load
      tasks:
        - task_key: load_prices
          notebook_task:
            notebook_path: ./notebooks/bronze_price_items.py
        - task_key: load_stores
          notebook_task:
            notebook_path: ./notebooks/bronze_stores.py
        - task_key: load_promotions
          notebook_task:
            notebook_path: ./notebooks/bronze_promotion_items.py
        - task_key: log_run
          run_if: ALL_DONE
          depends_on:
            - task_key: load_prices
            - task_key: load_stores
            - task_key: load_promotions
          notebook_task:
            notebook_path: ./notebooks/ops_run_log.py
            base_parameters:
              job_run_id: "{{job.run_id}}"
    silver_load:
      name: silver_load
      tasks:
        - task_key: create_functions
          notebook_task:
            notebook_path: ./notebooks/silver_functions.py
        - task_key: build_stores
          notebook_task:
            notebook_path: ./notebooks/silver_stores.py
        - task_key: build_price_obs
          depends_on:
            - task_key: build_stores
            - task_key: create_functions
          notebook_task:
            notebook_path: ./notebooks/silver_price_obs.py
        - task_key: build_promotion_obs
          depends_on:
            - task_key: build_stores
            - task_key: create_functions
          notebook_task:
            notebook_path: ./notebooks/silver_promotion_obs.py
        - task_key: build_price_history
          depends_on:
            - task_key: build_price_obs
          notebook_task:
            notebook_path: ./notebooks/silver_price_history.py
        - task_key: build_items
          depends_on:
            - task_key: build_stores
            - task_key: create_functions
          notebook_task:
            notebook_path: ./notebooks/silver_items.py
        - task_key: build_dq
          depends_on:
            - task_key: build_price_obs
            - task_key: build_price_history
            - task_key: build_items
          notebook_task:
            notebook_path: ./notebooks/silver_dq.py
        - task_key: log_run
          run_if: ALL_DONE
          depends_on:
            - task_key: build_dq
            - task_key: build_promotion_obs
          notebook_task:
            notebook_path: ./notebooks/ops_run_log.py
            base_parameters:
              job_run_id: "{{job.run_id}}"
    # Kaggle history backfill (milestone 3), a queue. One run = one batch of Kaggle versions from
    # workspace.ops.backfill_queue: claim_batch marks the next `batch_size` versions running (or re-claims a
    # batch an earlier run left running/failed), the loads read their files from the Ohio bucket, silver runs,
    # finish_batch marks them done (or failed). Runs every 30 minutes; when the queue is empty or daily_load
    # is running, claim_batch says go = no and the rest is skipped. To pause: set the schedule to PAUSED
    # (README, "Backfill queue"). Tasks are sequential on purpose: the Free Edition allows 5 concurrent tasks.
    kaggle_backfill:
      name: kaggle_backfill
      max_concurrent_runs: 1
      # a schedule tick that finds the previous batch still running is dropped, not queued
      queue:
        enabled: false
      parameters:
        - name: batch_size
          default: "5"
      schedule:
        quartz_cron_expression: "0 0/30 * * * ?"
        timezone_id: Asia/Jerusalem
        # paused 2026-11-16: the backfill finished on 2026-11-15 (157 done, 5 skipped)
        pause_status: PAUSED
      tasks:
        - task_key: claim_batch
          notebook_task:
            notebook_path: ./notebooks/backfill_queue.py
            base_parameters:
              mode: claim
              job_run_id: "{{job.run_id}}"
              batch_size: "{{job.parameters.batch_size}}"
              daily_load_job_id: ${resources.jobs.daily_load.id}
        - task_key: has_batch
          depends_on:
            - task_key: claim_batch
          condition_task:
            op: EQUAL_TO
            left: "{{tasks.claim_batch.values.go}}"
            right: "yes"
        - task_key: load_kaggle_prices
          timeout_seconds: 2400  # normal: 20 s to 5 min; a hung task is stopped and the batch retried
          depends_on:
            - task_key: has_batch
              outcome: "true"
          notebook_task:
            notebook_path: ./notebooks/bronze_kaggle.py
            base_parameters:
              kind: price
              job_run_id: "{{job.run_id}}"
        - task_key: load_kaggle_stores
          timeout_seconds: 2400  # normal: 20 s to 5 min; a hung task is stopped and the batch retried
          depends_on:
            - task_key: load_kaggle_prices
          notebook_task:
            notebook_path: ./notebooks/bronze_kaggle.py
            base_parameters:
              kind: store
              job_run_id: "{{job.run_id}}"
        - task_key: load_kaggle_promotions
          timeout_seconds: 2400  # normal: 20 s to 5 min; a hung task is stopped and the batch retried
          depends_on:
            - task_key: load_kaggle_stores
          notebook_task:
            notebook_path: ./notebooks/bronze_kaggle.py
            base_parameters:
              kind: promo
              job_run_id: "{{job.run_id}}"
        - task_key: run_silver
          depends_on:
            - task_key: load_kaggle_promotions
          run_job_task:
            job_id: ${resources.jobs.silver_load.id}
        - task_key: finish_batch
          run_if: ALL_DONE
          depends_on:
            - task_key: has_batch
              outcome: "true"
            - task_key: load_kaggle_prices
            - task_key: load_kaggle_stores
            - task_key: load_kaggle_promotions
            - task_key: run_silver
          notebook_task:
            notebook_path: ./notebooks/backfill_queue.py
            base_parameters:
              mode: finish
              job_run_id: "{{job.run_id}}"
        - task_key: log_run
          run_if: ALL_DONE
          depends_on:
            - task_key: finish_batch
          notebook_task:
            notebook_path: ./notebooks/ops_run_log.py
            base_parameters:
              job_run_id: "{{job.run_id}}"
    # Gold (milestone 4): facts first, marts later. Started by daily_load after silver.
    gold_load:
      name: gold_load
      max_concurrent_runs: 1
      tasks:
        - task_key: build_facts
          notebook_task:
            notebook_path: ./notebooks/gold_facts.py
        - task_key: build_dims
          notebook_task:
            notebook_path: ./notebooks/gold_dims.py
        - task_key: log_run
          run_if: ALL_DONE
          depends_on:
            - task_key: build_facts
            - task_key: build_dims
          notebook_task:
            notebook_path: ./notebooks/ops_run_log.py
            base_parameters:
              job_run_id: "{{job.run_id}}"
    # Category pilot (G1c): ai_classify on 1,000 products into silver.product_categories_pilot.
    # Run by hand; not part of daily_load.
    classify_products:
      name: classify_products
      max_concurrent_runs: 1
      # mode=pilot | eval | full; full is the resumable ai_query run over all active non-Be products
      # (no schedule, not in daily_load). Start it with: databricks bundle run classify_products --no-wait --params mode=full
      parameters:
        - name: mode
          default: pilot
        - name: sample_size
          default: "1000"
        - name: model
          default: databricks-gpt-oss-120b
        - name: prompt_version
          default: v2
        - name: batch_size
          default: "5000"
        - name: max_minutes
          default: "150"
      tasks:
        - task_key: classify
          timeout_seconds: 10800
          notebook_task:
            notebook_path: ./notebooks/silver_product_categories.py
            base_parameters:
              mode: "{{job.parameters.mode}}"
              sample_size: "{{job.parameters.sample_size}}"
              model: "{{job.parameters.model}}"
              prompt_version: "{{job.parameters.prompt_version}}"
              batch_size: "{{job.parameters.batch_size}}"
              max_minutes: "{{job.parameters.max_minutes}}"
              job_run_id: "{{job.run_id}}"
    daily_load:
      name: daily_load
      max_concurrent_runs: 1
      # AWS writes a marker file here when collection ends (infra/collect_marker.tf);
      # the new file starts this job. The external location has file events off,
      # so Databricks finds new files by listing the folder.
      trigger:
        pause_status: UNPAUSED
        file_arrival:
          url: s3://supermarket-detective-raw-971422709739/source=scraper/_markers/
          wait_after_last_change_seconds: 60
      tasks:
        - task_key: run_bronze
          run_job_task:
            job_id: ${resources.jobs.bronze_load.id}
        - task_key: run_silver
          depends_on:
            - task_key: run_bronze
          run_job_task:
            job_id: ${resources.jobs.silver_load.id}
        # gold runs only if silver succeeded (a DQ FAIL stops silver, so gold never reads a bad load)
        - task_key: run_gold
          depends_on:
            - task_key: run_silver
          run_job_task:
            job_id: ${resources.jobs.gold_load.id}
